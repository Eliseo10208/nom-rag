[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nom-rag"
version = "0.1.0"
description = "RAG over Mexican workplace-safety regulations (NOMs) with a first-class evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "selectolax>=0.3",
    "pypdf>=4.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
anthropic = ["anthropic>=0.40"]

[project.scripts]
nom-rag = "nom_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nom_rag = ["web/*.html"]

[tool.pytest.ini_options]
markers = [
    "llm: evals that call a real LLM (judge/generation); require GEMINI_API_KEY",
]
addopts = "-ra"
testpaths = ["evals"]
